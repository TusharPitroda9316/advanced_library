
{% extends 'base.html' %}
{% block title %}Member Form{% endblock %}

{% block content %}

<div class="page-heading">
    <h2>{{ 'Edit Member' if member else 'Register Member' }}</h2>
</div>

<div class="content-card form-card">
    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="mb-3">
            <label class="form-label">Full Name *</label>
            <input name="name" class="form-control"
                   value="{{ member.name if member else '' }}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Email *</label>
            <input type="email" name="email" class="form-control"
                   value="{{ member.email if member else '' }}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Phone</label>
            <input name="phone" class="form-control"
                   value="{{ member.phone if member else '' }}">
        </div>

        <div class="mb-3">
            <label class="form-label">Address</label>
            <textarea name="address" class="form-control" rows="3">{{ member.address if member else '' }}</textarea>
        </div>

        <button class="btn btn-primary">Save Member</button>
        <a href="{{ url_for('members') }}" class="btn btn-secondary">Cancel</a>
    </form>
</div>

{% endblock %}
