
{% extends 'base.html' %}
{% block title %}Book Form{% endblock %}

{% block content %}

<div class="page-heading">
    <h2>{{ 'Edit Book' if book else 'Add New Book' }}</h2>
</div>

<div class="content-card form-card">
    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="mb-3">
            <label class="form-label">Book Title *</label>
            <input name="title" class="form-control"
                   value="{{ book.title if book else '' }}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Author *</label>
            <input name="author" class="form-control"
                   value="{{ book.author if book else '' }}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">ISBN</label>
            <input name="isbn" class="form-control"
                   value="{{ book.isbn if book else '' }}">
        </div>

        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Category</label>
                <input name="category" class="form-control"
                       value="{{ book.category if book else '' }}">
            </div>

            <div class="col-md-6 mb-3">
                <label class="form-label">Publisher</label>
                <input name="publisher" class="form-control"
                       value="{{ book.publisher if book else '' }}">
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">Quantity *</label>
            <input type="number" min="1" name="quantity"
                   class="form-control"
                   value="{{ book.quantity if book else 1 }}" required>
        </div>

        <button class="btn btn-primary">Save Book</button>
        <a href="{{ url_for('books') }}" class="btn btn-secondary">Cancel</a>
    </form>
</div>

{% endblock %}
